name: Render SARX demo media

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/sarx_severance_demo.cpp"
      - "tools/sarx_humanoid_demo.cpp"
      - "tools/sarx_character_demo.cpp"
      - "tools/sarx_character_severance_demo.cpp"
      - "src/gltf_character.cpp"
      - "include/sarx/gltf_character.hpp"
      - "src/character_render.cpp"
      - "include/sarx/character_render.hpp"
      - "src/gltf_character.cpp"
      - "include/sarx/gltf_character.hpp"
      - "src/character_render.cpp"
      - "include/sarx/character_render.hpp"
      - "assets/quaternius/**"
      - "src/humanoid.cpp"
      - "include/sarx/humanoid.hpp"
      - "src/debug_render.cpp"
      - "include/sarx/debug_render.hpp"
      - ".github/workflows/demo-media.yml"
  push:
    branches:
      - "research/**"
    paths:
      - "tools/sarx_severance_demo.cpp"
      - "tools/sarx_humanoid_demo.cpp"
      - "tools/sarx_character_demo.cpp"
      - "tools/sarx_character_severance_demo.cpp"
      - "src/gltf_character.cpp"
      - "include/sarx/gltf_character.hpp"
      - "src/character_render.cpp"
      - "include/sarx/character_render.hpp"
      - "assets/quaternius/**"
      - "src/humanoid.cpp"
      - "include/sarx/humanoid.hpp"
      - "src/debug_render.cpp"
      - "include/sarx/debug_render.hpp"
      - ".github/workflows/demo-media.yml"

jobs:
  render-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configure
        run: cmake -S . -B build -DSARX_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build demos
        run: |
          cmake --build build --config Release --target sarx_severance_demo
          cmake --build build --config Release --target sarx_humanoid_demo
          cmake --build build --config Release --target sarx_character_demo
          cmake --build build --config Release --target sarx_character_severance_demo

      - name: Render bridge frames
        run: |
          ./build/sarx_severance_demo \
            --output build/demo_frames \
            --frames 120 \
            --cut-frame 45 | tee build/demo.log

      - name: Render humanoid frames
        run: |
          ./build/sarx_humanoid_demo \
            --output build/humanoid_frames \
            --frames 150 \
            --cut-frame 60 | tee build/humanoid.log

      - name: Render real skinned walk frames
        run: |
          ./build/sarx_character_demo \
            --character assets/quaternius/character.glb \
            --animations assets/quaternius/animations.glb \
            --clip Walk \
            --list-joints \
            --output build/character_frames \
            --frames 180 \
            --fps 30 | tee build/character.log

      - name: Render real skinned severance frames
        run: |
          ./build/sarx_character_severance_demo \
            --character assets/quaternius/character.glb \
            --animations assets/quaternius/animations.glb \
            --clip Walk \
            --detach-root upperarm_r \
            --output build/character_severance_frames \
            --frames 210 \
            --cut-frame 90 \
            --fps 30 \
            --require-ground-contact | tee build/character_severance.log

      - name: Encode MP4s
        run: |
          mkdir -p build/media
          ffmpeg -y \
            -framerate 30 \
            -i build/demo_frames/frame_%04d.ppm \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 20 \
            build/media/v04c_arm_severance.mp4

          ffmpeg -y \
            -framerate 30 \
            -i build/humanoid_frames/frame_%04d.ppm \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 20 \
            build/media/v04d_humanoid_shoulder_severance.mp4

          ffmpeg -y \
            -framerate 30 \
            -i build/character_frames/frame_%04d.ppm \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 20 \
            build/media/v05_real_character_walk.mp4

          ffmpeg -y \
            -framerate 30 \
            -i build/character_severance_frames/frame_%04d.ppm \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 20 \
            build/media/v05_real_character_walk_severance.mp4

      - name: Encode GIF previews
        run: |
          ffmpeg -y \
            -i build/media/v04c_arm_severance.mp4 \
            -vf "fps=15,scale=720:-1:flags=lanczos,palettegen" \
            build/media/palette_bridge.png

          ffmpeg -y \
            -i build/media/v04c_arm_severance.mp4 \
            -i build/media/palette_bridge.png \
            -lavfi "fps=15,scale=720:-1:flags=lanczos[x];[x][1:v]paletteuse" \
            build/media/v04c_arm_severance.gif

          ffmpeg -y \
            -i build/media/v04d_humanoid_shoulder_severance.mp4 \
            -vf "fps=15,scale=720:-1:flags=lanczos,palettegen" \
            build/media/palette_humanoid.png

          ffmpeg -y \
            -i build/media/v04d_humanoid_shoulder_severance.mp4 \
            -i build/media/palette_humanoid.png \
            -lavfi "fps=15,scale=720:-1:flags=lanczos[x];[x][1:v]paletteuse" \
            build/media/v04d_humanoid_shoulder_severance.gif

          ffmpeg -y \
            -i build/media/v05_real_character_walk.mp4 \
            -vf "fps=15,scale=720:-1:flags=lanczos,palettegen" \
            build/media/palette_character.png

          ffmpeg -y \
            -i build/media/v05_real_character_walk.mp4 \
            -i build/media/palette_character.png \
            -lavfi "fps=15,scale=720:-1:flags=lanczos[x];[x][1:v]paletteuse" \
            build/media/v05_real_character_walk.gif

          ffmpeg -y \
            -i build/media/v05_real_character_walk_severance.mp4 \
            -vf "fps=15,scale=720:-1:flags=lanczos,palettegen" \
            build/media/palette_character_severance.png

          ffmpeg -y \
            -i build/media/v05_real_character_walk_severance.mp4 \
            -i build/media/palette_character_severance.png \
            -lavfi "fps=15,scale=720:-1:flags=lanczos[x];[x][1:v]paletteuse" \
            build/media/v05_real_character_walk_severance.gif

      - name: Record provenance
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "frames=120"
            echo "fps=30"
            echo "cut_frame=45"
            echo "backend=CPU Body"
            echo "scheduler=full pre-cut; adaptive wound-domain + free-island closure post-cut"
            echo
            echo "[bridge demo log]"
            cat build/demo.log
            echo
            echo "[humanoid demo log]"
            cat build/humanoid.log
            echo
            echo "[real skinned character walk log]"
            cat build/character.log
            echo
            echo "[real skinned character walk severance log]"
            cat build/character_severance.log
          } > build/media/provenance.txt

      - name: Upload prototype media
        uses: actions/upload-artifact@v4
        with:
          name: sarx-character-integration-media
          path: |
            build/media/v04c_arm_severance.mp4
            build/media/v04c_arm_severance.gif
            build/media/v04d_humanoid_shoulder_severance.mp4
            build/media/v04d_humanoid_shoulder_severance.gif
            build/media/v05_real_character_walk.mp4
            build/media/v05_real_character_walk.gif
            build/media/v05_real_character_walk_severance.mp4
            build/media/v05_real_character_walk_severance.gif
            build/media/provenance.txt
          if-no-files-found: error
